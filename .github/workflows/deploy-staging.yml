name: Deploy staging

on:
  workflow_dispatch:

concurrency:
  group: staging-deploy
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: true
  NG_CLI_ANALYTICS: false
  PNPM_CONFIG_PROGRESS: false

jobs:
  deploy:
    name: Build and deploy staging
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://staging.omayatravel.com

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: npm

      - name: Install dependencies
        run: |
          npm ci > /tmp/omaya-install.log 2>&1 || {
            cat /tmp/omaya-install.log
            exit 1
          }

      - name: Lint
        run: |
          npm run lint > /tmp/omaya-lint.log 2>&1 || {
            cat /tmp/omaya-lint.log
            exit 1
          }

      - name: Type check
        run: |
          npm run type-check > /tmp/omaya-type-check.log 2>&1 || {
            cat /tmp/omaya-type-check.log
            exit 1
          }

      - name: Test
        run: |
          npm run test > /tmp/omaya-test.log 2>&1 || {
            cat /tmp/omaya-test.log
            exit 1
          }

      - name: Build
        run: |
          npm run build > /tmp/omaya-build.log 2>&1 || {
            cat /tmp/omaya-build.log
            exit 1
          }

      - name: Prepare static staging artifact
        shell: pwsh
        run: ./scripts/deployment/prepare-staging-static.ps1 -BrowserDistPath apps/website/dist/website/browser

      - name: Configure SSH
        shell: bash
        env:
          SSH_HOST: ${{ vars.HOSTINGER_STAGING_HOST }}
          SSH_PORT: ${{ vars.HOSTINGER_STAGING_PORT }}
          SSH_PRIVATE_KEY: ${{ secrets.HOSTINGER_STAGING_SSH_KEY }}
        run: |
          test -n "$SSH_HOST"
          test -n "$SSH_PORT"
          test -n "$SSH_PRIVATE_KEY"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/omaya_staging_deploy
          chmod 600 ~/.ssh/omaya_staging_deploy
          touch ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          timeout 15s ssh-keyscan -q -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Deploy browser output to Hostinger staging
        shell: bash
        env:
          SSH_HOST: ${{ vars.HOSTINGER_STAGING_HOST }}
          SSH_PORT: ${{ vars.HOSTINGER_STAGING_PORT }}
          SSH_USER: ${{ vars.HOSTINGER_STAGING_USERNAME }}
          SSH_PATH: ${{ vars.HOSTINGER_STAGING_PATH }}
        run: |
          test -n "$SSH_HOST"
          test -n "$SSH_PORT"
          test -n "$SSH_USER"
          test -n "$SSH_PATH"
          ssh -i ~/.ssh/omaya_staging_deploy -o StrictHostKeyChecking=accept-new -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "mkdir -p \"$SSH_PATH\""
          rsync -azq --delete --checksum \
            -e "ssh -i ~/.ssh/omaya_staging_deploy -o StrictHostKeyChecking=accept-new -p $SSH_PORT" \
            apps/website/dist/website/browser/ \
            "$SSH_USER@$SSH_HOST:$SSH_PATH/"
