@if (isOpen()) {
  <div class="newsletter-popup" role="presentation" (click)="close()">
    <section
      class="newsletter-popup__dialog"
      role="dialog"
      aria-modal="true"
      aria-labelledby="newsletter-popup-title"
      (click)="$event.stopPropagation()"
    >
      <div class="newsletter-popup__media" aria-hidden="true">
        <img
          [src]="mediaImage().src"
          alt=""
          [width]="mediaImage().width"
          [height]="mediaImage().height"
          loading="lazy"
          decoding="async"
        />
      </div>

      <button
        type="button"
        class="newsletter-popup__close"
        [attr.aria-label]="i18n.t('newsletterPopup.close')"
        (click)="close()"
      >
        <span aria-hidden="true"></span>
      </button>

      <div class="newsletter-popup__content">
        <img
          class="newsletter-popup__logo"
          [src]="brand().solidLogoSrc"
          [alt]="brand().logoAlt"
          width="152"
          height="83"
          loading="lazy"
          decoding="async"
        />
        <p class="newsletter-popup__eyebrow">{{ brand().tagline }}</p>
        <h2 id="newsletter-popup-title">
          {{ i18n.t('newsletterPopup.title') }}<span aria-hidden="true">👀</span><br />
          {{ i18n.t('newsletterPopup.titleSecondLine') }}
        </h2>

        @if (!isSignupOpen()) {
          <div class="newsletter-popup__actions">
            <button type="button" class="newsletter-popup__primary" (click)="openSignup()">
              {{ i18n.t('newsletterPopup.signUp') }}
            </button>
            <button type="button" class="newsletter-popup__secondary" (click)="close()">
              {{ i18n.t('newsletterPopup.noThanks') }}
            </button>
          </div>
        } @else {
          <form class="newsletter-popup__form" (submit)="submitPopup($event)">
            <label for="newsletter-popup-email">{{ i18n.t('newsletterPopup.emailLabel') }}</label>
            <input
              id="newsletter-popup-email"
              type="email"
              name="email"
              [placeholder]="i18n.t('newsletterPopup.emailLabel')"
              autocomplete="email"
              required
            />
            <app-form-honeypot />
            <button type="submit" [disabled]="submitStatus() === 'sending'">
              {{
                submitStatus() === 'sending'
                  ? i18n.t('newsletterPopup.joining')
                  : i18n.t('newsletterPopup.signUp')
              }}
            </button>
            <app-form-status [message]="submitMessage()" [isError]="submitStatus() === 'error'" />
          </form>
        }
      </div>
    </section>
  </div>
}
