@if (isOpen()) {
  <div class="newsletter-popup" role="presentation" (click)="close()">
    <section
      class="newsletter-popup__dialog"
      role="dialog"
      aria-modal="true"
      aria-labelledby="newsletter-popup-title"
      (click)="$event.stopPropagation()"
    >
      <div class="newsletter-popup__media" aria-hidden="true">
        <!--
          Up to 34rem phones get a capped AVIF copy instead of the full image, and Amelia also has
          one for tablets up to 64rem. See POPUP_MOBILE_WIDTH and AMELIA_POPUP_COPIES in
          scripts/generate-tour-web-images.mjs for why each is one capped copy, not a candidate list.
          An image without copies leaves the <source> without a srcset, so the browser skips it.
        -->
        <picture style="display: contents">
          <source
            media="(max-width: 34rem)"
            type="image/avif"
            [attr.srcset]="mediaImage().src | newsletterPopupMobileSrcset"
          />
          <source
            media="(max-width: 64rem)"
            type="image/avif"
            [attr.srcset]="mediaImage().src | newsletterPopupTabletSrcset"
          />
          <img
            [src]="mediaImage().src"
            alt=""
            [width]="mediaImage().width"
            [height]="mediaImage().height"
            loading="lazy"
            decoding="async"
          />
        </picture>
      </div>

      <button
        type="button"
        class="newsletter-popup__close"
        [attr.aria-label]="i18n.t('newsletterPopup.close')"
        (click)="close()"
      >
        <span aria-hidden="true"></span>
      </button>

      <div class="newsletter-popup__content">
        <!--
          7.8rem wide, so each pixel ratio picks a lossless copy at its width; see LOGO_WIDTHS in
          scripts/generate-tour-web-images.mjs. width and height are the logo file's own shape: the
          152x83 declared before was a different shape, so the browser reserved the wrong height and the
          buttons below moved when the logo arrived.
        -->
        <img
          class="newsletter-popup__logo"
          [src]="brand().solidLogoSrc"
          [attr.srcset]="brand().solidLogoSrc | logoSrcset"
          sizes="7.8rem"
          [alt]="brand().logoAlt"
          [width]="brand().solidLogoSize.width"
          [height]="brand().solidLogoSize.height"
          loading="lazy"
          decoding="async"
        />
        <p class="newsletter-popup__eyebrow">{{ brand().tagline }}</p>
        <h2 id="newsletter-popup-title">
          {{ i18n.t('newsletterPopup.title') }}<span aria-hidden="true">👀</span><br />
          {{ i18n.t('newsletterPopup.titleSecondLine') }}
        </h2>
        <p class="newsletter-popup__body">{{ i18n.t('newsletterPopup.body') }}</p>

        @if (!isSignupOpen()) {
          <div class="newsletter-popup__actions">
            <button type="button" class="newsletter-popup__primary" (click)="openSignup()">
              {{ i18n.t('newsletterPopup.signUp') }}
            </button>
            <button type="button" class="newsletter-popup__secondary" (click)="close()">
              {{ i18n.t('newsletterPopup.noThanks') }}
            </button>
          </div>
        } @else {
          <form class="newsletter-popup__form" (submit)="submitPopup($event)">
            <label for="newsletter-popup-email">{{ i18n.t('newsletterPopup.emailLabel') }}</label>
            <input
              id="newsletter-popup-email"
              type="email"
              name="email"
              [placeholder]="i18n.t('newsletterPopup.emailLabel')"
              autocomplete="email"
              required
            />
            <app-form-honeypot />
            <button type="submit" [disabled]="submitStatus() === 'sending'">
              {{
                submitStatus() === 'sending'
                  ? i18n.t('newsletterPopup.joining')
                  : i18n.t('newsletterPopup.signUp')
              }}
            </button>
            <app-form-status [message]="submitMessage()" [isError]="submitStatus() === 'error'" />
          </form>
        }
      </div>
    </section>
  </div>
}
