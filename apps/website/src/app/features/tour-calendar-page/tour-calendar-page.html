<main class="tour-calendar">
  <section class="tour-calendar__hero">
    <img src="/assets/images/home-page/private-tours-right-bgr.webp" alt="Group tour landscape" />
    <h1>Calendar {{ year() }}</h1>
  </section>

  <section class="tour-calendar__body" aria-label="Tour calendar months">
    <div class="tour-calendar__grid">
      @for (month of months(); track month.name) {
        <button
          type="button"
          class="tour-calendar__month"
          [class.tour-calendar__month--empty]="month.tours.length === 0"
          (click)="openMonth(month)"
        >
          <img [src]="month.image" [alt]="month.name + ' tour preview'" loading="lazy" />
          <span>{{ month.name }}</span>
          @if (month.tours.length > 0) {
            <small>{{ month.tours.length }} tour{{ month.tours.length === 1 ? '' : 's' }}</small>
          }
        </button>
      }
    </div>
  </section>
</main>
