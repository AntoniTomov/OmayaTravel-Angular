<main class="not-yet">
  <section class="not-yet__hero" aria-labelledby="not-yet-title">
    <img
      src="/assets/images/home-page/private-tours-right-bgr.webp"
      width="1920"
      height="1080"
      alt=""
      fetchpriority="high"
    />
    <h1 id="not-yet-title">{{ i18n.t('notYet.heroTitle') }}</h1>
  </section>

  <section
    class="not-yet__message"
    [class.not-yet__message--invite]="showNewsletter()"
    aria-label="No tours available for this month"
  >
    <h2>
      {{ i18n.t('notYet.message') }}
    </h2>

    @if (showNewsletter()) {
      <form class="not-yet__newsletter" (submit)="submitNewsletterForm($event)">
        <label for="not-yet-newsletter-email">{{ i18n.t('homepage.newsletterEmail') }}</label>
        <input
          id="not-yet-newsletter-email"
          type="email"
          name="email"
          [placeholder]="i18n.t('homepage.newsletterEmailPlaceholder')"
          autocomplete="email"
          required
        />
        <app-form-honeypot />
        <button type="submit" [disabled]="newsletterStatus() === 'sending'">
          {{
            newsletterStatus() === 'sending'
              ? i18n.t('homepage.newsletterSending')
              : i18n.t('homepage.newsletterSubmit')
          }}
        </button>
        <app-form-status
          [message]="newsletterMessage()"
          [isError]="newsletterStatus() === 'error'"
        />
      </form>
    } @else {
      <a [routerLink]="ctaTarget()">{{ i18n.t('notYet.cta') }}</a>
    }
  </section>
</main>
