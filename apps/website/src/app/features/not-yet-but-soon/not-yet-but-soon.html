<main class="not-yet">
  <section class="not-yet__hero" aria-labelledby="not-yet-title">
    <!--
      Phone and tablet crops, then full-frame copies; see PAGE_HERO_SOURCES in
      scripts/generate-tour-web-images.mjs. The square photograph never draws wider than the viewport.
    -->
    <picture style="display: contents">
      <source
        media="(max-width: 30rem)"
        type="image/avif"
        [attr.srcset]="heroImage | pageHeroCropSrcset: 'phone'"
        sizes="480px"
      />
      <source
        media="(max-width: 48rem)"
        type="image/avif"
        [attr.srcset]="heroImage | pageHeroCropSrcset: 'tablet'"
        sizes="768px"
      />
      <source type="image/avif" [attr.srcset]="heroImage | tourWebImageSrcset" sizes="100vw" />
      <img [src]="heroImage" width="1920" height="1080" alt="" fetchpriority="high" />
    </picture>
    <h1 id="not-yet-title">{{ i18n.t('notYet.heroTitle') }}</h1>
  </section>

  <section class="not-yet__message" aria-label="No tours available for this month">
    <h2>
      {{ i18n.t('notYet.message') }}
    </h2>
    <a [routerLink]="ctaTarget()">{{ i18n.t('notYet.cta') }}</a>
  </section>
</main>
