<section class="mission-section" aria-labelledby="mission-section-title">
  <div class="mission-section__inner">
    <img
      [src]="image.src"
      [width]="image.width"
      [height]="image.height"
      [alt]="image.alt"
      loading="lazy"
    />

    <div class="mission-section__content">
      <h2 id="mission-section-title">Our mission</h2>
      <p>
        If you share our desire to rediscover the human side of travel - through cultural
        encounters, thoughtful journeys, and small groups- you might feel at home with Omaya. Join
        us to explore Central Asia, North Africa, the Middle East, the Balkans, and beyond
      </p>
      <a routerLink="/why-book-with-us/">Meet Omaya</a>
    </div>
  </div>
</section>
