<section class="mission-section" aria-labelledby="mission-section-title">
  <div class="mission-section__inner">
    <img
      [src]="image().src"
      [width]="image().width"
      [height]="image().height"
      [alt]="image().alt"
      loading="lazy"
    />

    <div class="mission-section__content">
      <h2 id="mission-section-title">{{ title() }}</h2>
      <p>{{ copy() }}</p>
      <a routerLink="/our-story/">{{ cta() }}</a>
    </div>
  </div>
</section>
