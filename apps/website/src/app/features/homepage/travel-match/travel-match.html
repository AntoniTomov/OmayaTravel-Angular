<section class="travel-match" aria-labelledby="travel-match-title" [style]="sectionStyle()">
  <div class="travel-match__inner">
    <header class="travel-match__header">
      <h2 id="travel-match-title">{{ section().title }}</h2>
      @if (section().subtitle) {
        <p>{{ section().subtitle }}</p>
      }
    </header>

    <div class="travel-match__grid">
      @for (feature of features(); track feature.title) {
        @if (calendarLinkEnabled()) {
          <a class="travel-match__item" [routerLink]="calendarTarget">
            <img
              class="travel-match__icon"
              [src]="feature.icon.src"
              [width]="feature.icon.width"
              [height]="feature.icon.height"
              [alt]="feature.icon.alt"
              loading="eager"
            />
            <h3>{{ feature.title }}</h3>
            <p>{{ feature.description }}</p>
          </a>
        } @else {
          <div class="travel-match__item">
            <img
              class="travel-match__icon"
              [src]="feature.icon.src"
              [width]="feature.icon.width"
              [height]="feature.icon.height"
              [alt]="feature.icon.alt"
              loading="eager"
            />
            <h3>{{ feature.title }}</h3>
            <p>{{ feature.description }}</p>
          </div>
        }
      }
    </div>
  </div>
</section>
