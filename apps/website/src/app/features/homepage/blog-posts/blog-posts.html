<section class="blog-posts" aria-labelledby="blog-posts-title">
  <div class="blog-posts__inner">
    <header class="blog-posts__header">
      <h2 id="blog-posts-title">Blog Posts</h2>
      <p class="blog-post__text">
        One inspiring story is <b>worth traveling</b>. Discover more about
        <b>local food, tradition and history</b>. Read the stories that make you want to travel.
      </p>
    </header>

    <div class="blog-posts__grid">
      @for (post of posts; track post.slug) {
        <article class="blog-posts__card">
          <a [routerLink]="'/' + post.slug + '/'" class="blog-posts__image">
            <img
              [src]="post.image.src"
              [alt]="post.image.alt"
              width="550"
              height="550"
              loading="lazy"
            />
          </a>
          <h3>
            <a [routerLink]="'/' + post.slug + '/'">{{ post.title }}</a>
          </h3>
          <p class="blog-posts__date">{{ post.date }}</p>
        </article>
      }
    </div>
  </div>
</section>
