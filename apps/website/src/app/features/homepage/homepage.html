<main class="homepage">
  <section class="homepage__hero">
    <img
      class="homepage__hero-image"
      [src]="activeSlideImage().src"
      [srcset]="activeSlideImage().srcset"
      [sizes]="activeSlideImage().sizes"
      [width]="activeSlideImage().width"
      [height]="activeSlideImage().height"
      [alt]="activeSlideImage().alt"
      [attr.loading]="activeSlideImage().loading"
      [attr.fetchpriority]="activeSlideImage().fetchPriority"
    />
    <div class="homepage__hero-content">
      <h1>{{ i18n.t('homepage.heroTitle') }}</h1>
      <p>{{ i18n.t('homepage.heroSubtitle') }}</p>

      <form class="homepage__trip-search" (submit)="$event.preventDefault(); submitTripSearch()">
        <div>
          <label for="trip-destination">{{ i18n.t('homepage.whereTo') }}</label>
          <select
            id="trip-destination"
            name="destination"
            [value]="selectedDestination()"
            [attr.aria-invalid]="searchError().length > 0"
            aria-describedby="trip-search-error"
            (change)="updateDestination($any($event.target).value)"
          >
            <option value="">{{ i18n.t('homepage.whereTo') }}</option>
            @for (destination of destinations(); track destination.target) {
              <option [value]="destination.target">{{ destination.label }}</option>
            }
          </select>
        </div>

        <div>
          <label for="trip-month">{{ i18n.t('homepage.when') }}</label>
          <select
            id="trip-month"
            name="month"
            [value]="selectedMonth()"
            (change)="updateMonth($any($event.target).value)"
          >
            <option value="">{{ i18n.t('homepage.when') }}</option>
            @for (month of months(); track month) {
              <option [value]="month">{{ month }}</option>
            }
          </select>
        </div>

        <button type="submit">{{ i18n.t('homepage.findNow') }}</button>

        @if (searchError()) {
          <p id="trip-search-error" class="homepage__trip-error">{{ searchError() }}</p>
        }
      </form>
    </div>

    <div class="homepage__carousel-controls" [attr.aria-label]="i18n.t('homepage.carouselLabel')">
      @for (slide of hero.slides; track slide.image.key; let index = $index) {
        <button
          type="button"
          [class.homepage__carousel-button--active]="activeSlideIndex() === index"
          [attr.aria-label]="i18n.t('homepage.showSlide') + ' ' + (index + 1)"
          [attr.aria-current]="activeSlideIndex() === index"
          (click)="setSlide(index)"
        ></button>
      }
    </div>
  </section>

  <app-travel-match />
  <app-featured-trips />
  <app-mission-section />
  <app-private-tours />
  <section class="homepage__newsletter" aria-labelledby="homepage-newsletter-title">
    <div class="homepage__newsletter-inner">
      <div>
        <h2 id="homepage-newsletter-title">Join Newsletter</h2>
        <p>To receive our best deals</p>
      </div>

      <form class="homepage__newsletter-form" (submit)="submitNewsletterForm($event)">
        <label for="homepage-newsletter-email">Email address</label>
        <input
          id="homepage-newsletter-email"
          type="email"
          name="email"
          placeholder="Email address"
          autocomplete="email"
          required
        />
        <label class="form-honeypot" aria-hidden="true">
          Website
          <input type="text" name="website" autocomplete="off" tabindex="-1" />
        </label>
        <button type="submit" [disabled]="newsletterStatus() === 'sending'">
          {{ newsletterStatus() === 'sending' ? 'Joining...' : 'Subscribe' }}
        </button>
        @if (newsletterMessage()) {
          <p class="form-status" [class.form-status--error]="newsletterStatus() === 'error'">
            {{ newsletterMessage() }}
          </p>
        }
      </form>
    </div>
  </section>
  <app-blog-posts />
</main>
