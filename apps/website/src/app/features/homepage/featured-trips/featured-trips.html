<section class="featured-trips" aria-labelledby="featured-trips-title">
  <div class="featured-trips__inner">
    <div class="featured-trips__heading">
      <h2 id="featured-trips-title">{{ i18n.t('homepage.featuredTripsTitle') }}</h2>
      <div class="featured-trips__controls" [attr.aria-label]="i18n.t('homepage.featuredTripsControls')">
        <button
          type="button"
          [attr.aria-label]="i18n.t('homepage.previousTrip')"
          (click)="shiftTrip(-1)"
        >
          &lt;
        </button>
        <button
          type="button"
          [attr.aria-label]="i18n.t('homepage.nextTrip')"
          (click)="shiftTrip(1)"
        >
          &gt;
        </button>
      </div>
    </div>

    <div
      #carousel
      class="featured-trips__carousel"
      tabindex="0"
      (scroll)="syncActiveTripFromScroll($event)"
      (pointerdown)="startDrag($event)"
      (pointermove)="drag($event)"
      (pointerup)="endDrag($event)"
      (pointercancel)="endDrag($event)"
      (pointerleave)="endDrag($event)"
    >
      <div class="featured-trips__track">
        @for (entry of tempTours(); track entry.tempId) {
          <article
            #tripCard
            class="featured-trips__card"
            [class.featured-trips__card--active]="activeTripIndex() === entry.originalIndex"
          >
            <a class="featured-trips__image-link" [routerLink]="entry.trip.target">
              <img
                [src]="entry.trip.image.src"
                [srcset]="entry.trip.image.srcset"
                [sizes]="entry.trip.image.sizes"
                [width]="entry.trip.image.width"
                [height]="entry.trip.image.height"
                [alt]="entry.trip.image.alt"
                [attr.loading]="entry.trip.image.loading"
                [attr.fetchpriority]="entry.trip.image.fetchPriority"
              />
              <span>{{ entry.trip.eyebrow }}</span>
            </a>

            <div class="featured-trips__content">
              <h3>
                <a [routerLink]="entry.trip.target">{{ entry.trip.title }}</a>
              </h3>
              <p class="featured-trips__price">
                {{ entry.trip.price }} <span>{{ i18n.t('homepage.perPerson') }}</span>
              </p>
              <p class="featured-trips__duration">{{ entry.trip.duration }}</p>
              <p class="featured-trips__description">{{ entry.trip.description }}</p>
            </div>
          </article>
        }
      </div>
    </div>
  </div>
</section>
